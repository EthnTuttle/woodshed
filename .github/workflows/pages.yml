name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['index.html', 'app.js', 'styles.css', 'data/**', 'tools/build_pages.py', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# never let two deploys race; don't cancel one mid-flight
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Builds WITHOUT --with-assets, so no vendor images or PDFs are ever published.
      - name: Install Pillow (thumbnail generation)
        run: python3 -m pip install --quiet Pillow

      - name: Build publishable site
        run: python3 tools/build_pages.py

      # The line we hold: downscaled thumbnails are fine to publish; full-size drawings and
      # plan PDFs are the product and must never be. Fail the deploy rather than drift.
      - name: Assert only thumbnails are published
        run: |
          if [ -d dist/assets/pdf ]; then
            echo "::error::dist/assets/pdf exists — plan PDFs must never be published. Aborting."
            exit 1
          fi
          if [ -d dist/assets/img ]; then
            echo "::error::dist/assets/img exists — that is the full-size set. Aborting."
            exit 1
          fi
          python3 - <<'PY'
          import json, os, sys, glob
          d = json.load(open('dist/data/plans.json'))
          if d['meta'].get('assets_rehosted'):
              sys.exit('::error::meta.assets_rehosted is true')
          bad_pdf = [p['slug'] for p in d['plans']
                     if any(str(u).startswith('local:') for u in (p.get('extra_urls') or []))]
          if bad_pdf:
              sys.exit(f'::error::local PDF refs leaked: {bad_pdf[:5]}')
          off = [p['slug'] for p in d['plans']
                 if p.get('image_local_path') and not p['image_local_path'].startswith('assets/thumb/')]
          if off:
              sys.exit(f'::error::image paths outside assets/thumb/: {off[:5]}')
          cap = d['meta'].get('thumb_width', 520)
          try:
              from PIL import Image
              wide = []
              for f in glob.glob('dist/assets/thumb/*.jpg'):
                  with Image.open(f) as im:
                      if im.width > cap + 8:
                          wide.append((os.path.basename(f), im.width))
              if wide:
                  sys.exit(f'::error::thumbnails exceed the {cap}px cap: {wide[:5]}')
          except ImportError:
              print('Pillow unavailable; skipped the pixel-width check')
          n = len(glob.glob('dist/assets/thumb/*.jpg'))
          mb = sum(os.path.getsize(f) for f in glob.glob('dist/assets/thumb/*.jpg')) / 1e6
          print(f'OK: {len(d["plans"])} records, {n} thumbnails, {mb:.1f} MB, no PDFs, no full-size images')
          PY

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
